name: Phase 25.4 B1 C++ Compiler Torture

on:
  push:
    branches: [phase25-4-cpp-torture-b1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp-semantic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain metadata
        run: |
          uname -a
          nproc
          clang++ --version
          free -h
      - name: Regression-test profiler timeout and output handling
        run: |
          python3 -m unittest discover -s benchmarks/phase25_4 -p 'test_profile_moss.py'
      - name: Validate preserved benchmark reports
        run: |
          python3 benchmarks/compiler_torture/verify.py
          python3 benchmarks/real_world/verify.py
          python3 benchmarks/phase25_4/cpp_baseline/check_report_consistency.py
      - name: Build optimized C++ Moss compiler (-O2)
        run: make --jobs=2 MOSS_LDFLAGS= moss-opt
      - name: Validate portable torture suite
        run: |
          python3 benchmarks/compiler_torture/generate.py --validate-only --moss ./build/compiler/moss-opt
      - name: Run Phase 25.4 B1 C++ Performance Baseline
        run: |
          python3 benchmarks/phase25_4/cpp_baseline/run.py \
            --moss ./build/compiler/moss-opt \
            --reps 5 \
            --timeout 40
      - name: Upload benchmark artifacts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase25-4-b1-cpp-baseline
          path: |
            benchmarks/compiler_torture/
            benchmarks/phase25_4/cpp_baseline/results/
            benchmarks/phase25_4/cpp_baseline/REPORT.md
          if-no-files-found: warn
