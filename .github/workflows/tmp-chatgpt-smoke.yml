name: Temporary Moss smoke test

on:
  push:
    branches:
      - tmp-chatgpt-codespace-doc-test-20260923

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Moss
        run: make
      - name: Verify Boolean language surface
        shell: bash
        run: |
          set -euo pipefail
          ./moss agent bootstrap --json > build-bootstrap.json
          grep -F '"boolean":["and","or","xor","not"]' build-bootstrap.json
          grep -F '"boolean_precedence_high_to_low":["not","and","xor","or"]' build-bootstrap.json
      - name: Check SWARM-037 negative cases
        shell: bash
        run: |
          set -euo pipefail
          expect_reject() {
            source="$1"; message="$2"
            set +e
            output="$(./moss check "$source" --json 2>&1)"
            status=$?
            set -e
            test "$status" -ne 0
            printf '%s\n' "$output" | grep -F '"code": "TYPE_MISMATCH"'
            printf '%s\n' "$output" | grep -F "$message"
          }
          expect_reject tests/negative/swarm_037_and_non_bool.moss "boolean 'and' operands must have type 'Bool'"
          expect_reject tests/negative/swarm_037_or_non_bool.moss "boolean 'or' operands must have type 'Bool'"
          expect_reject tests/negative/swarm_037_xor_non_bool.moss "boolean 'xor' operands must have type 'Bool'"
          set +e
          output="$(./moss check tests/negative/swarm_012_not_int.moss --json 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F "not operand must have type 'Bool'"
      - name: Native and Fast Debug parity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'true\nfalse\ntrue\ntrue\nfalse\ntrue\ntrue\ntrue\nfalse\nfalse\ntrue')"
          ./moss check tests/swarm_037_boolean_operators.moss --json
          mkdir -p build/smoke
          ./moss -Oshared-memory tests/swarm_037_boolean_operators.moss -o build/smoke/swarm_037.rs
          rustc -D warnings build/smoke/swarm_037.rs -o build/smoke/swarm_037
          native="$(build/smoke/swarm_037)"
          interpreted="$(./moss run --interp tests/swarm_037_boolean_operators.moss)"
          printf 'native:\n%s\ninterpreted:\n%s\n' "$native" "$interpreted"
          test "$native" = "$expected"
          test "$interpreted" = "$expected"
      - name: Validate swarm tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_swarm_feedback.py
          python3 tools/check_swarm_issues.py
      - name: Preserve SWARM-036 symbolic rejection
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(./moss check tests/negative/swarm_036_symbolic_and.moss --json 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F UNSUPPORTED_EXPRESSION_OPERATOR
